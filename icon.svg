<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="garlicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentCyan)" stroke-width="6" opacity="0.4"/>

  <!-- Barcode Pattern Lines Behind -->
  <g opacity="0.12" fill="#38bdf8">
    <rect x="80" y="80" width="12" height="70" rx="3"/>
    <rect x="104" y="80" width="24" height="70" rx="3"/>
    <rect x="140" y="80" width="8" height="70" rx="3"/>
    <rect x="160" y="80" width="18" height="70" rx="3"/>
    <rect x="190" y="80" width="10" height="70" rx="3"/>
    <rect x="212" y="80" width="30" height="70" rx="3"/>
    <rect x="254" y="80" width="14" height="70" rx="3"/>
    <rect x="280" y="80" width="20" height="70" rx="3"/>
    <rect x="312" y="80" width="8" height="70" rx="3"/>
    <rect x="332" y="80" width="26" height="70" rx="3"/>
    <rect x="370" y="80" width="14" height="70" rx="3"/>
    <rect x="396" y="80" width="32" height="70" rx="3"/>
  </g>

  <!-- Main Garlic Bulb Structure -->
  <!-- Central Sprout / Shoot -->
  <path d="M256 110 C240 170 210 210 190 230 C220 220 250 200 256 160 C262 200 292 220 322 230 C302 210 272 170 256 110 Z" fill="url(#leafGrad)" filter="url(#glow)"/>
  <path d="M256 110 C265 145 285 175 310 195 C295 175 280 145 270 115 Z" fill="#6ee7b7" opacity="0.8"/>

  <!-- Garlic Head Body (Cloves) -->
  <g filter="url(#glow)">
    <!-- Back / Outer Left Clove -->
    <path d="M180 240 C120 260 90 320 110 380 C125 425 175 450 220 445 C180 410 165 340 180 240 Z" fill="url(#garlicGrad)" opacity="0.85"/>
    
    <!-- Back / Outer Right Clove -->
    <path d="M332 240 C392 260 422 320 402 380 C387 425 337 450 292 445 C332 410 347 340 332 240 Z" fill="url(#garlicGrad)" opacity="0.85"/>

    <!-- Mid Left Clove -->
    <path d="M200 230 C150 265 135 340 155 400 C170 435 210 455 256 455 C220 420 205 350 210 240 Z" fill="url(#garlicGrad)"/>
    
    <!-- Mid Right Clove -->
    <path d="M312 230 C362 265 377 340 357 400 C342 435 302 455 256 455 C292 420 307 350 302 240 Z" fill="url(#garlicGrad)"/>

    <!-- Center Main Clove -->
    <path d="M256 210 C225 250 215 330 225 400 C235 445 277 445 287 400 C297 330 287 250 256 210 Z" fill="#ffffff"/>
  </g>

  <!-- Root base subtle line -->
  <path d="M230 450 Q256 462 282 450" stroke="#ca8a04" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Brand Typography -->
  <text x="256" y="482" font-family="'Inter', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="6">VETE</text>
</svg>
